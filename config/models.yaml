# Real mode: local Qwen-VL analysis + Grounding DINO + SAM 2.
# Paths are relative to this YAML. CPU is portable; MPS is opt-in.
device: auto
cache_dir: ../.cache/models
local_files_only: false
categories: [tree, rock, mountain, building, bridge, bush, water, road, pillar, lantern, gate, stairs, fence, flag, rock_debris]
projection: isometric

grounding:
  reuse_image_inputs: true
  batch_size: 1  # CUDA: opt into 2-4 after comparing predictions on your hardware.
  model_id: IDEA-Research/grounding-dino-tiny
  revision: main
  box_threshold: 0.30
  text_threshold: 0.25
  nms_iou: 0.5
  max_detections: 100
  tiled: true
  tile_size: 768
  tile_overlap: 0.25
  include_full_image: true
  prompt_group_size: 10
  relax_from_round: 3
  relaxed_box_threshold: 0.25
  relaxed_text_threshold: 0.20
  prompts:
    tree: ancient tree
    rock: mountain rock
    mountain: mountain cliff
    building: temple building
    bridge: stone bridge
    bush: shrub bush
    water: pond water
    road: stone road
    pillar: stone pillar
    lantern: stone lantern
    gate: ornate gate
    stairs: stone stairs
    fence: stone fence railing
    flag: red flag banner
    rock_debris: broken rock debris

sam:
  model_config_name: configs/sam2.1/sam2.1_hiera_t.yaml
  checkpoint: null
  repo_id: facebook/sam2.1-hiera-tiny
  filename: sam2.1_hiera_tiny.pt
  revision: main
  multimask_output: false
  mask_threshold: 0.0
  local_retry: true
  local_padding: 64

qwen_vl:
  # Complete local Transformers Instruct model directory; no automatic download.
  model_path: null
  dtype: auto
  image_long_edge: 1536
  max_images: 4
  max_input_tokens: 16384
  max_new_tokens: 2048

scene_reviewer:
  provider: local  # Shares qwen_vl with scene analysis. Use api to opt into HTTP.
  model: ""
  base_url: null
  api_key_env: VLM_API_KEY
  timeout: 60
  max_retries: 1
  image_long_edge: 1536

# Real Stage B needs local RealESRGAN_x4plus weights and requirements-upscale.txt.
# Missing weights are reported per asset, never silently replaced with interpolation.
# backend: lanczos is an explicit preview-only option.
upscale:
  backend: real_esrgan
  checkpoint: null
  tile: 256
  tile_pad: 16
  skip_transparent_tiles: true

# Optional local-only Qwen adapters. Leave model_path null to keep them unloaded.
qwen_layered:
  model_path: null
  dtype: auto
  layers: 4
  resolution: 640
  num_inference_steps: 50
  true_cfg_scale: 4.0
  seed: 0

qwen_image_edit:
  model_path: null
  dtype: auto
  num_inference_steps: 50
  true_cfg_scale: 4.0
  seed: 0
